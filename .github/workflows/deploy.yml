name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Build VeoStory app
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install Luli Crush dependencies
        working-directory: pomeranian-match3
        run: npm ci

      - name: Build Luli Crush
        working-directory: pomeranian-match3
        run: npm run build
        env:
          # Nested under the Pages site: /VeoStory/luli-crush/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/luli-crush/

      - name: Bundle Luli Crush into Pages dist
        run: |
          mkdir -p dist/luli-crush
          cp -R pomeranian-match3/dist/. dist/luli-crush/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
